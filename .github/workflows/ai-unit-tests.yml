name: AI unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: escriptorium/app/apps/ai/requirements-test.txt
      - name: Install unit-test dependencies
        run: python -m pip install -r escriptorium/app/apps/ai/requirements-test.txt
      - name: Run Django-free unit tests
        working-directory: escriptorium/app/apps
        run: python -m unittest ai.tests -v
