name: AI unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: escriptorium/app/apps/ai/requirements-test.txt
      - name: Install unit-test dependencies
        run: python -m pip install -r escriptorium/app/apps/ai/requirements-test.txt
      - name: Run Django-free unit tests
        working-directory: escriptorium/app/apps
        run: python -m unittest ai.tests -v

  django-integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: escriptorium_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escriptorium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: escriptorium_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SQL_HOST: localhost
      REDIS_HOST: localhost
      DJANGO_SETTINGS_MODULE: escriptorium.settings
      PYTHONPATH: apps
      ESCRIPT_TEST_MEDIA: /tmp/escript-ci-media
      KRAKEN_TRAINING_DEVICE: cpu
      KRAKEN_INFERENCE_DEVICE: cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: escriptorium/app/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips libffi-dev libpq5 libxml2 libxslt1.1 default-jre-headless build-essential
      - name: Install application dependencies
        run: python -m pip install -r escriptorium/app/requirements.txt
      - name: Check application dependencies
        run: python -m pip check
      - name: Run PostgreSQL-backed core and AI tests
        working-directory: escriptorium/app
        run: python manage.py test core.tests.test_training_limits core.tests.test_ketos_evaluation core.tests.test_tasks ai.django_integration_tests --noinput -v 1
