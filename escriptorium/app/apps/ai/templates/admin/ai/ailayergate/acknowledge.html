{% extends "admin/base_site.html" %}
{% block content %}
<p>Type exactly: <code>{{ phrase }}</code></p>
<form method="post">{% csrf_token %}
  <input type="text" name="phrase" size="40" autocomplete="off">
  <input type="hidden" name="action" value="acknowledge_sample_action">
  {% for obj in queryset %}
  <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
  {% endfor %}
  <input type="submit" value="Acknowledge">
</form>
{% endblock %}
