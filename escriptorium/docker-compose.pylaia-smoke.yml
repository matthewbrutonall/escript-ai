# Optional local PyLaia HTTP smoke.
#
# This file is not loaded by default. `docker compose up` does not read it.
# From escriptorium/:
#   export PYLAIA_MODEL_DIR=/path/to/model
#   docker compose -f docker-compose.pylaia-smoke.yml up -d
#   docker compose -f docker-compose.pylaia-smoke.yml down
#
# PYLAIA_MODEL_DIR must be a model directory outside this repository.
# Compose interpolates it on every command, including down.
# The image tag is local. This file does not build it and does not join
# the Escript AI services. Escript AI transcription jobs do not call it.

name: escript-ai-pylaia-smoke

services:
  pylaia-smoke:
    image: escript-ai-pylaia-skeleton:local
    pull_policy: never
    entrypoint: ["python"]
    command:
      - -m
      - ai.external_engines.pylaia.server
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --allow-container-bind
      - --backend
      - decode
      - --model-dir
      - /models/current
      - --model-id
      - ${PYLAIA_MODEL_ID:-huginmunin}
      - --work-root
      - /work
      - --timeout
      - ${PYLAIA_TIMEOUT:-180}
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ${PYLAIA_MODEL_DIR:?set PYLAIA_MODEL_DIR}:/models/current:ro
      - ${PYLAIA_WORK_DIR:-/tmp/escript-ai-pylaia-work}:/work
